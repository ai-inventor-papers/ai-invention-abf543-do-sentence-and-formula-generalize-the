    delete: regenerable
    source: "uv venv .venv --python=3.12 && uv pip install --python .venv/bin/python z3-solver numpy scipy scikit-learn pandas aiohttp loguru tenacity beautifulsoup4 lxml requests torch transformers sentence-transformers safetensors huggingface_hub psutil pyyaml sentencepiece protobuf tiktoken"
  - path: raw/pilot/
    delete: regenerable
    source: "unzip -q -o /ai-inventor/aii_data/runs/run_qY2a2IS-WLIs/user_uploads/dpv_pilot_study.zip -d raw/pilot/"
  - path: "**/__pycache__/"
    delete: regenerable
    source: "python recreates bytecode caches on import"
