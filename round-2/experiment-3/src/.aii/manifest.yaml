entries:
  - path: .venv/
    delete: regenerable
    source: "bash restore.sh   # uv venv .venv --python 3.12 && uv pip install -r pyproject.toml && torch==2.11.0 from the cu128 index"
  - path: .nltk_data/
    delete: redownloadable
    source: "bash restore.sh   # curl https://raw.githubusercontent.com/nltk/nltk_data/gh-pages/packages/corpora/{wordnet,omw-1.4}.zip"
  - path: "**/__pycache__/"
    delete: regenerable
    source: "regenerated automatically by Python on import"
  - path: vendor/ds/.pytest_cache/
    delete: regenerable
    source: "cd vendor/ds && ../../.venv/bin/python -m pytest -q -c pytest.ini tests/test_fol.py"
